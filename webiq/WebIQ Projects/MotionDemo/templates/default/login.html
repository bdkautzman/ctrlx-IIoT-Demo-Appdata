<div class="iqel-login-area-overlay">
    <div class="iqel-project-image" id="project-image"></div>
    <div class="iqel-forms">
        <div class="iq-select-box realms-select-box" data-ui="iq-select-box"></div>

        <div class="iq-input-field outlined iq-variant-01 no-label no-icon no-unit iqel-login-if"
            data-ui="user-name-input">
            <div class="iqel-widget-container">
                <fieldset class="iqel-state-layer">
                    <legend class="iqel-input-label"></legend>
                    <div class="iqel-input-icon" data-ui="icon"></div>
                    <div class="iqel-widget-content">
                        <div class="iqel-input-container">
                            <input type="text" data-ui="user-field" placeholder="User Name" class="iqel-input-value"
                                size="1">
                            <div class="iqel-input-unit" data-ui="unit"></div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </div>

        <div class="iq-input-field outlined iq-variant-04 no-label no-icon no-unit iqel-login-if password">
            <div class="iqel-widget-container">
                <fieldset class="iqel-state-layer">
                    <legend class="iqel-input-label"></legend>
                    <div class="iqel-input-icon"></div>
                    <div class="iqel-widget-content">
                        <div class="iqel-input-container">
                            <input type="password" data-ui="password-field" placeholder="Password"
                                class="iqel-input-value" size="1">
                            <div class="iqel-input-unit"></div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </div>
    </div>
    <div class="iqel-buttons">
        <div data-ui="autologin-button" type="button" value="Auto Login"
            class="iq-button filled iqel-login-btn no-icon button-auto-login hidden">
            <div data-ui="button" class="iqel-button-element">
                <div class="iqel-state-layer">
                    <div data-ui="icon" class="iqel-button-icon"></div>
                    <div data-ui="button-label" class="iqel-button-label">Auto Login</div>
                </div>
            </div>
        </div>
        <div data-ui="login-button" type="button" value="Login" class="iq-button iqel-login-btn no-icon filled">
            <div data-ui="button" class="iqel-button-element">
                <div class="iqel-state-layer">
                    <div data-ui="icon" class="iqel-button-icon"></div>
                    <div data-ui="button-label" class="iqel-button-label">Login</div>
                </div>
            </div>
        </div>
        <div data-ui="clear-button" type="button" value="Clear" class="iq-button iqel-login-btn no-icon">
            <div data-ui="button" class="iqel-button-element">
                <div class="iqel-state-layer">
                    <div data-ui="icon" class="iqel-button-icon"></div>
                    <div data-ui="button-label" class="iqel-button-label">Reset</div>
                </div>
            </div>
        </div>
    </div>
</div>
