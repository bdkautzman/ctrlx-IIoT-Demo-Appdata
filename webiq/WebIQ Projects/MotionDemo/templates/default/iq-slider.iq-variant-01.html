<div class="iqel-widget-container">
    <div class="iqel-widget-content">
        <div class="iqel-icon" data-ui="icon"></div>
        <div class="iqel-label" data-ui="label"></div>
        <div class="iqel-box">
            <!-- slider track may be configured with attribute `data-orientation="horizontal"`
            or `data-orientation="vertical"` to configure orientation per layout -->
            <div class="iqel-slider-track" data-ui="track" data-orientation="horizontal">
                <div class="iqel-scale-container">
                    <div class="iqel-scale" data-ui="scale"></div>
                    <div class="iqel-scale-free" data-ui="scalefree"></div>
                </div>
                <div class="iqel-handle" data-ui="handle" tabindex="0">
                    <div class="iqel-handle-indicator"></div>
                    <div class="iqel-value" data-ui="value"></div>
                    <div class="iqel-touch-zone" data-ui="touchzone"></div>
                </div>
            </div>
        </div>
        <div class="iqel-unit" data-ui="unit"></div>
    </div>
</div>
