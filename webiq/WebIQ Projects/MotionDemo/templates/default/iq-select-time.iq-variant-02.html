<div class="iqel-time-button">
    <fieldset class="iqel-selected-time" data-ui="selected-time">
        <legend class="iqel-widget-label" data-ui="button-label"></legend>
        <div class="iqel-value" data-ui="button-value"></div>
        <div class="iqel-icon-container">
            <div class="iqel-icon" data-ui="button-icon"></div>
        </div>
    </fieldset>
</div>
<div class="iqel-time-selection" data-ui="time-selection">
    <div class="iqel-selection-background">
        <div class="iqel-selection-content">
            <div class="iqel-widget-content">
                <div class="iqel-widget-header">
                    <div data-ui="label" class="iqel-label"></div>
                </div>
                <div class="iqel-selection-container">
                    <div data-ui="hour-select" class="iqel-hour-select iqel-box">
                        <input data-ui="current" class="iqel-input iqel-current" size="1" inputmode="numeric">
                    </div>
                    <div data-ui="divider" class="iqel-divider">:</div>
                    <div data-ui="minute-select" class="iqel-minute-select iqel-box">
                        <input data-ui="current" class="iqel-input iqel-current" size="1" inputmode="numeric">
                    </div>
                    <div data-ui="divider" class="iqel-divider">:</div>
                    <div data-ui="second-select" class="iqel-second-select iqel-box">
                        <input data-ui="current" class="iqel-input iqel-current" size="1" inputmode="numeric">
                    </div>
                </div>
            </div>
            <div class="iqel-clockface-container" data-ui="clockface-container">
                <div class="iqel-clockface hours" data-ui="clockface-hours"></div>
                <div class="iqel-clockface hours primary" data-ui="clockface-hours-overlay"></div>
                <div class="iqel-clockface minutes" data-ui="clockface-minutes"></div>
                <div class="iqel-clockface minutes primary" data-ui="clockface-minutes-overlay"></div>
                <div class="iqel-clockface seconds" data-ui="clockface-seconds"></div>
                <div class="iqel-clockface seconds primary" data-ui="clockface-seconds-overlay"></div>
            </div>
        </div>
    </div>
</div>
