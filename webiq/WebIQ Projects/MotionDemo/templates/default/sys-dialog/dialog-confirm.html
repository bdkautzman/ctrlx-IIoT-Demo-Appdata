<div class="iqel-dialog-background">
    <div data-ui="dialog-content" class="iqel-dialog-window">

        <div class="iqel-dialog-header">
            <div data-ui="dialog-box-title" class="iqel-dialog-box-title">Confirmation</div>
            <div data-ui="iq-button" data-label="" data-icon-class="icon" class="iq-variant-01 close"></div>
        </div>
        <div data-ui="dialog-box-frame" class="iqel-dialog-box-frame">
            <div data-ui="dialog-box-content" class="iqel-dialog-box-content">

                <div class="iqel-dialog-content">

                    <div data-name="confirm-title"></div>
                    <div data-name="confirm-text" class="iqel-confirmation-text"></div>

                </div>
                <div class="iqel-dialog-footer">
                    <div data-ui="iq-button" data-function="deny" data-label="${V_CONFIRM_BTN_CANCEL}" class="iq-variant-01 cancel-button"></div>
                    <div data-ui="iq-button" data-function="confirm" data-label="${V_CONFIRM_BTN_OK}" class="iq-variant-01 ok-button filled"></div>
                </div>
            </div>
        </div>
    </div>
</div>
