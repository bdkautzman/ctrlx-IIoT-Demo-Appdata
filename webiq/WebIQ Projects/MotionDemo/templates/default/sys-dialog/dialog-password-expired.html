<div class="iqel-dialog-background">
    <div data-ui="dialog-content" class="iqel-dialog-window">
        <div class="iqel-dialog-header">
            <div data-ui="dialog-box-title" class="iqel-dialog-box-title">Notification</div>
            <div data-ui="iq-button" data-label="" data-icon-class="icon" class="iq-variant-01 close"></div>
        </div>
        <div data-ui="dialog-box-frame" class="iqel-dialog-box-frame">
            <div data-ui="dialog-box-content" class="iqel-dialog-box-content">
                <div class="iqel-dialog-content">
                    <div data-ui="iq-text-display" data-name="current-user" data-label="${user_name}" data-unit-text="" class="iq-variant-01"></div>
                    <div data-ui="iq-input-field" data-name="current-pwd" data-label="${current_pwd}" class="iq-variant-04 password" data-template="default/iq-input-field.iq-variant-04" data-unit-text=""></div>
                    <div data-ui="iq-input-field" data-name="new-pwd" data-label="${new_pwd}" class="iq-variant-04 password" data-template="default/iq-input-field.iq-variant-04" data-unit-text=""></div>
                    <div data-ui="iq-input-field" data-name="repeat-pwd" data-label="${confirm_new_pwd}" class="iq-variant-04 password" data-template="default/iq-input-field.iq-variant-04" data-unit-text=""></div>
                </div>
                <div class="iqel-dialog-footer">
                    <div data-ui="iq-button" data-label="${okay}" data-name="apply-btn" class="iq-variant-01 apply-button"></div>
                    <div data-ui="iq-button" data-label="${cancel}" data-name="cancel-btn" class="iq-variant-01 cancel-button"></div>
                </div>
            </div>
        </div>
    </div>
</div>
